# Release : pousser un tag « x.y.z » (sans v, ou « x.y.z-beta.n » pour une pré-release), ou lancer
# ce workflow à la main depuis main (Actions › Release › Run workflow, avec la version), compile le
# launcher pour Windows (installer/build.ps1) et pour Linux (installer/build-linux.sh), signe les
# deux archives puis publie la release GitHub avec :
#   Misty-x.y.z.zip, Mistly-Setup-x.y.z.exe                 Windows
#   Misty-x.y.z-linux-x86_64.tar.gz                          Linux
#   <archive>.sha256 et <archive>.minisig pour chaque archive
# La mise à jour automatique refuse toute archive sans ces deux preuves
# (crates/misty-core/src/systeme/update.rs).
#
# Secrets :
#   MINISIGN_KEY       clé privée minisign (sans mot de passe) : obligatoire, dans l'environment « release »
#   CURSEFORGE_KEY     clé API CurseForge (contenu de curseforge.key, à la racine du repo) : obligatoire
#   CODESIGN_PFX       certificat « CN=ENDERR.WIN » en .pfx encodé en base64 : facultatif
#   CODESIGN_PASSWORD  mot de passe du .pfx : facultatif
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  # Bouton « Run workflow » : publie la version de Cargo.toml depuis main. Le tag est créé par la
  # release, sur le commit lancé (même vérification : il doit être égal à Cargo.toml).
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (exactement celle de Cargo.toml, ex. 0.4.1-beta.2)"
        required: true
        type: string

# Lecture seule par défaut : seul le job « publier » peut écrire (créer la release)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Le tag doit être la version de Cargo.toml
        id: v
        env:
          # entrée du bouton, passée par une variable (jamais collée dans le script)
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            # à la main : seulement depuis main, et jamais par-dessus une version déjà publiée
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Lancer la release depuis main (lancée depuis ${{ github.ref }})" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Le tag $tag existe déjà : changer la version dans Cargo.toml" >&2
              exit 1
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          if [ "$tag" != "$version" ]; then
            echo "Le tag $tag ne correspond pas à la version de Cargo.toml ($version) : le launcher proposerait la mise à jour en boucle" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

      - name: Secrets obligatoires
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        run: |
          [ -n "$CURSEFORGE_KEY" ] || { echo "Secret CURSEFORGE_KEY absent : CurseForge ne marcherait pas dans cette version" >&2; exit 1; }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Clés privées
        shell: pwsh
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          # lue par crates/misty-core/build.rs, ignorée par git
          [IO.File]::WriteAllText("$PWD/curseforge.key", $env:CURSEFORGE_KEY.Trim())
          # certificat de signature de code, cherché par installer/build.ps1 (sinon l'exe n'est pas signé)
          if ($env:CODESIGN_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP "signature.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
            $mdp = ConvertTo-SecureString $env:CODESIGN_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $mdp | Out-Null
            Remove-Item $pfx
          } else {
            Write-Host "::warning::Pas de secret CODESIGN_PFX : Misty.exe et l'installateur ne seront pas signés"
          }

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Compilation, zip et installateur (installer/build.ps1)
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            publish/Misty-${{ needs.version.outputs.version }}.zip
            publish/Mistly-Setup-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  linux:
    needs: version
    # même système que la CI : glibc 2.35, compatible avec la plupart des distributions récentes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libgtk-3-dev

      - name: Clé CurseForge
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        run: printf '%s' "$CURSEFORGE_KEY" | tr -d '\r\n ' > curseforge.key

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Compilation et archive (installer/build-linux.sh)
        run: bash installer/build-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: publish/Misty-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  publier:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    # Environment GitHub « release » : MINISIGN_KEY y est rangée, avec validation obligatoire
    environment: release
    permissions:
      contents: write
    env:
      # Outil de signature, épinglé : version et empreinte SHA-256 de l'archive officielle
      MINISIGN_VERSION: "0.12"
      MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: publish
          merge-multiple: true

      - name: Empreintes SHA-256 et signatures minisign des archives
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          [ -n "$MINISIGN_KEY" ] || { echo "Secret MINISIGN_KEY absent : la release ne pourrait pas être signée" >&2; exit 1; }
          version="${{ needs.version.outputs.version }}"

          # minisign, vérifié contre l'empreinte épinglée
          curl -fsSL -o "$RUNNER_TEMP/minisign.tar.gz" \
            "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/minisign-$MINISIGN_VERSION-linux.tar.gz"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          minisign="$RUNNER_TEMP/minisign-linux/x86_64/minisign"

          # clé publique intégrée au launcher : chaque signature doit passer avec elle
          cle_publique="$(grep -oP 'CLE_PUBLIQUE_MAJ: &str = "\K[^"]+' crates/misty-core/src/systeme/app_info.rs)"
          [ -n "$cle_publique" ] || { echo "CLE_PUBLIQUE_MAJ introuvable dans app_info.rs" >&2; exit 1; }

          printf '%s' "$MINISIGN_KEY" > "$RUNNER_TEMP/misty.key"
          trap 'rm -f "$RUNNER_TEMP/misty.key"' EXIT
          cd publish
          for archive in "Misty-$version.zip" "Misty-$version-linux-x86_64.tar.gz"; do
            # même format que sha256sum : « <empreinte>  <fichier> »
            sha256sum "$archive" > "$archive.sha256"
            "$minisign" -S -s "$RUNNER_TEMP/misty.key" -m "$archive" -t "Mistly Launcher $version"
            "$minisign" -Vm "$archive" -P "$cle_publique" \
              || { echo "La signature ne correspond pas à CLE_PUBLIQUE_MAJ : MINISIGN_KEY n'est pas la bonne clé" >&2; exit 1; }
          done
          ls -l

      - name: Notes de version (section de CHANGELOG.md)
        run: |
          version="${{ needs.version.outputs.version }}"
          awk -v titre="## $version" '
            $0 == titre { dedans = 1; next }
            dedans && /^## / { exit }
            dedans { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "Pas de section « ## $version » dans CHANGELOG.md" >&2; exit 1; }

      - name: Release GitHub
        env:
          # Jeton d'un administrateur (secret de l'environnement « release ») : le ruleset des tags
          # interdit au jeton de GitHub Actions de créer le tag de la release
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "Secret RELEASE_TOKEN absent de l'environnement release" >&2; exit 1; }
          version="${{ needs.version.outputs.version }}"
          options=(--title "Mistly Launcher $version" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # bouton : la release crée le tag sur le commit compilé
            options+=(--target "${{ github.sha }}")
          else
            options+=(--verify-tag)
          fi
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then options+=(--prerelease); fi
          gh release create "$version" \
            "publish/Misty-$version.zip" \
            "publish/Mistly-Setup-$version.exe" \
            "publish/Misty-$version.zip.sha256" \
            "publish/Misty-$version.zip.minisig" \
            "publish/Misty-$version-linux-x86_64.tar.gz" \
            "publish/Misty-$version-linux-x86_64.tar.gz.sha256" \
            "publish/Misty-$version-linux-x86_64.tar.gz.minisig" \
            "${options[@]}"
