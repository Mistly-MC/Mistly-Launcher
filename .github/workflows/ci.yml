# Vérifications à chaque push et chaque PR, sous Windows et sous Linux : format, clippy
# (avertissements = erreurs), tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 : la version Linux publiée est compilée sur la même (glibc plus ancienne,
        # donc compatible avec plus de distributions)
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # misty-client : les textures de cape partagées, utilisées par les tests
          submodules: recursive

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests hors ligne (les tests réseau sont marqués #[ignore])
      - name: Tests
        run: cargo test --workspace
