# Workspace du launcher :
#   crates/misty-core  la logique, sans interface ni Slint (comptes, Minecraft, contenu, système…)
#   crates/misty-ui    l'interface Slint (ui/*.slint), compilée à part
#   crates/misty-app   l'application : main.rs, fenêtres, code des pages ; produit Misty.exe
[workspace]
resolver = "2"
members = ["crates/misty-core", "crates/misty-ui", "crates/misty-app"]
default-members = ["crates/misty-app", "crates/misty-core"]

[workspace.package]
# Seule source de la version du launcher (app_info::VERSION, installer/build.ps1, release.yml).
# Le tag de la release GitHub (sans « v ») doit être identique.
version = "0.4.5-beta.1"
edition = "2021"
authors = ["xTheoxreborn"]
license-file = "LICENSE.txt"
repository = "https://github.com/Mistly-MC/Mistly-Launcher"

[workspace.dependencies]
misty-core = { path = "crates/misty-core" }
misty-ui = { path = "crates/misty-ui" }
# Interface
# Sans la fonction « system-tray » (activée par défaut, inutilisée ici). Le rendu logiciel reste :
# c'est le secours quand OpenGL manque (pilote absent, bureau à distance).
slint = { version = "1.18", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "1.18"
# Asynchrone + réseau
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures = "0.3"
# Fils persistants du rendu du studio de skin (media/skins.rs)
rayon = "1"
# Données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Fichiers
zip = { version = "9", default-features = false, features = ["deflate"] }
# Archives .tar.gz (mise à jour et Horizon sous Linux)
flate2 = "1"
tar = "0.4"
sha1 = "0.11"
# Mise à jour vérifiée : empreinte SHA-256 et signature minisign du zip (systeme/update.rs)
sha2 = "0.11"
minisign-verify = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
dirs = "7"
# Divers
anyhow = "1"
# Erreurs typées de misty-core (une par domaine, avec leur clé de traduction)
thiserror = "2"
rand = "0.10"
regex = "1"
unicode-normalization = "0.1"
urlencoding = "2"
open = "5"
rfd = "0.18"
discord-rich-presence = "1.1"
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
# Connexion Microsoft (auth/account.rs) : OAuth 2 par code d'appareil et renouvellement (oauth2),
# puis Xbox Live → Minecraft (minecraft-msa-auth). Les deux utilisent le reqwest 0.12 du launcher.
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
minecraft-msa-auth = "0.4"
# Lecture du xuid dans le jeton Minecraft (JWT)
base64 = "0.22"
# Windows
winreg = "0.56"
mslnk = "0.1"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading"] }
# Musique en jeu : morceau lu par les contrôles multimédia de Windows (media/musique.rs)
# + raccourcis et barre des tâches (systeme/lanceur.rs)
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
# Jetons Microsoft dans le Gestionnaire d'identifiants Windows (auth/coffre.rs)
keyring = "4"
winresource = "0.1"
# Tests de la mise à jour vérifiée : signe des archives avec une clé jetable
minisign = "0.10"

# Développement : « cargo run » reste rapide à recompiler, mais l'interface est fluide
# (Slint, le rendu et les images sont compilés optimisés une fois pour toutes).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Pas d'informations de débogage pour les dépendances : l'exe de développement passe de près de
# 900 Mo à beaucoup moins, et l'édition de liens (lente sous Windows) en est d'autant plus rapide.
# Le code du launcher garde les siennes.
debug = false

# L'interface générée (près de 20 Mo de Rust) : le même niveau que le launcher, sinon chaque
# changement dans ui/*.slint prendrait plusieurs minutes de plus
[profile.dev.package.misty-ui]
opt-level = 1
debug = false

# Release : optimisation sur tout le programme en un seul bloc (compilation plus longue, exe plus
# petit et un peu plus rapide)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
